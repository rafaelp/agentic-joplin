name: Bug report
description: Something in the sync agent or the Claude Code plugin does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Sync agent (launchd)
        - Claude Code plugin
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `npm run logs` or `~/Library/Logs/agentic-joplin/`. Remove note titles or anything private.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: macOS 26.1, Node 24.21.0, Joplin CLI 3.7.1, agentic-joplin 0.1.0
    validations:
      required: true
